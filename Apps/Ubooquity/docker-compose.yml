# Ubooquity — comic, ebook and PDF library server — as one ZimaOS app.
#
# ────────────────────────────────────────────────────────────────────────────
# 🔴 THE ADMIN PAGE COMES FIRST, AND IT IS ON THE OTHER PORT.
#
#   http://<your-zimaos>:2203/ubooquity/admin   ← set the password, add folders
#   http://<your-zimaos>:2202/ubooquity/        ← the library, once you have
#
#   Until the admin page has been through, the library on 2202 shows nothing.
#
# 🔴 NOTHING IS SERVED AT THE ROOT. Measured against this exact image on
#   2026-08-16: both ports answer "/" with HTTP 500 "Could not find matching
#   provider (wrong URL)", and "/ubooquity/" resp. "/ubooquity/admin" with 200 —
#   no redirect in either direction. That is not a fault, it is how Ubooquity is
#   built. x-casaos.index below is "/ubooquity/" for exactly that reason; typed
#   by hand, the path has to be included. This is the first app in this store
#   whose index is not "/", and it was found the hard way: installed with the
#   converter's default "/", the tile opened a Jetty error page on a container
#   that was running perfectly.
#
# 🔴 BOTH PORTS ARE CLOSED FROM THE LAN UNTIL YOU OPEN THEM. Since ZFW
#   rules.json version 3 the default policy is "deny" and every newly published
#   Docker port gets LOG+DROP (ZIMAOS-KNOWLEDGE.md §8.4). Add an allow rule for
#   2202 and 2203, then "apply" AND "commit" — without apply the rule does
#   nothing. Without this the tile answers on the host and times out from your
#   notebook.
#
# ────────────────────────────────────────────────────────────────────────────
# WHAT IT MOUNTS
#
#   /config → /DATA/AppData/ubooquity/config   database, thumbnails, settings
#   /books  → /DATA/Media/Books                EPUB, PDF
#   /comics → /DATA/Media/Comics               CBZ, CBR
#   /files  → /DATA/Media/Files                raw files offered for download
#
#   The /DATA/Media/* anchors are the host paths ZimaOS itself proposes for
#   media (§36.1), so Files and the other media apps already look there; on a
#   ZimaCube it also keeps the library off the small system disk. Change the
#   host side under "Advanced (show more)" if your library lives elsewhere — the
#   container paths must stay as they are, Ubooquity scans exactly /books,
#   /comics and /files.
#
# 🔴 THE FILE MANAGER POINTS THE WRONG WAY, AND IT COST THE FIRST TESTER AN
#   HOUR. /DATA/AppData/ubooquity/ is what you find when you look for "the
#   ubooquity folder", and of it ONLY config is mounted. Eight books dropped
#   into /DATA/AppData/ubooquity/books on 2026-08-16 were invisible to the app;
#   the container's /books stayed empty and the library said "No file to
#   display", which reads like a broken import rather than a wrong folder. If
#   an earlier install used a different volume layout, its directories survive
#   the change and look exactly as plausible as the live ones — the only
#   witness is what the CONTAINER sees:
#     docker inspect ubooquity --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}
#     {{end}}'   and   docker exec ubooquity ls /books
#
# 🟡 NOTHING IS SCANNED AUTOMATICALLY. "Automatic scan period" ships as
#   Disabled and only "Scan collection at launch" is ticked, so a file copied in
#   while the app runs is never noticed. Admin page → GENERAL → LAUNCH NEW SCAN,
#   and read the counter: "Added/updated" is the witness, not the file listing
#   on the host.
#
#   Read-write on purpose: Ubooquity writes nothing into them by itself, but the
#   admin page can delete files, and a read-only mount would make that fail
#   silently instead of refusing it.
#
# 🟡 PERMISSIONS depend on who creates the directories. Through the ZimaOS API a
#   missing bind source is created 0777 and PUID=1000 can write; created by a
#   hand-run "docker compose up" it is root:root 0755 and the container cannot
#   (§36). If the app starts but sees no files, run
#   stat -c '%a %u:%g' /DATA/Media/Books before changing anything here.
#
# MAXMEM is the JVM heap cap in MB. Upstream ships it empty; 1024 here keeps the
# Java process below the 2 GB container limit instead of letting the cgroup
# OOM-kill it. Raise both together for a large library.
#
# No secrets in this file — Ubooquity has no credentials until you set the admin
# password yourself on port 2203, and that one never touches this compose.
#
name: ubooquity
services:
  ubooquity:
    image: lscr.io/linuxserver/ubooquity:3.1.0-ls91
    container_name: ubooquity
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Europe/Berlin
    - MAXMEM=1024
    restart: unless-stopped
    ports:
    - mode: ingress
      target: 2202
      published: '2202'
      protocol: tcp
    - mode: ingress
      target: 2203
      published: '2203'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/ubooquity/config
      target: /config
    - type: bind
      source: /DATA/Media/Books
      target: /books
    - type: bind
      source: /DATA/Media/Comics
      target: /comics
    - type: bind
      source: /DATA/Media/Files
      target: /files
    networks:
    - ubooquity-network
    labels:
      icon: https://raw.githubusercontent.com/chicohaager/zima-appstore/main/Apps/Ubooquity/icon.png
    deploy:
      resources:
        limits:
          memory: 2GB
          cpus: '2.00'
    x-casaos:
      ports:
      - container: '2202'
        description:
          en_us: Library — the reader-facing web UI, at /ubooquity/
      - container: '2203'
        description:
          en_us: Admin page at /ubooquity/admin — set the password here first
      volumes:
      - container: /config
        description:
          en_us: Database, thumbnails and settings
      - container: /books
        description:
          en_us: Ebook library (EPUB, PDF)
      - container: /comics
        description:
          en_us: Comic library (CBZ, CBR)
      - container: /files
        description:
          en_us: Raw files offered for plain download
networks:
  ubooquity-network:
    driver: bridge
x-casaos:
  architectures:
  - amd64
  - arm64
  main: ubooquity
  id: io.github.chicohaager.ubooquity
  scheme: http
  version: 3.1.0
  author: Lintuxer
  developer: Vaemendis
  category: Media
  icon: https://raw.githubusercontent.com/chicohaager/zima-appstore/main/Apps/Ubooquity/icon.png
  title:
    en_us: Ubooquity
    custom: Ubooquity
  tagline:
    en_us: Comics, ebooks and PDFs from your own shelf, in the browser
  description:
    en_us: |-
      Ubooquity serves comics, ebooks and PDFs to any browser and to OPDS readers — one small Java process, no cloud account, no telemetry.

      **Set the admin password first, on port 2203:** open `http://<your-zimaos>:2203/ubooquity/admin` and tell Ubooquity which folders to scan. The library on **2202** stays empty until you have.

      **Both ports serve under `/ubooquity/`, never at the root** — the tile is set to that path, and a hand-typed address needs it too.

      Put your files in `/DATA/Media/Books`, `/DATA/Media/Comics` and `/DATA/Media/Files` — **not** in `/DATA/AppData/ubooquity/`, where only `config` is mounted. Then run a scan from the admin page; nothing is picked up automatically. Both ports need a ZFW allow rule before they answer from the LAN.
  tips:
    before_install:
      en_us: |-
        **THE ADMIN PAGE COMES FIRST — port 2203, not 2202.**

        `http://<your-zimaos>:2203/ubooquity/admin` asks you to set an admin password, and that is where you tell Ubooquity which folders to scan. Until that is done the library on 2202 is empty, and it will look as though nothing was imported.

        - **Everything lives under `/ubooquity/`.** The root of both ports answers `HTTP 500 Could not find matching provider (wrong URL)` — measured against this image, not guessed, and it is how Ubooquity is built, not a fault. The tile is set to `/ubooquity/` for that reason; a hand-typed address needs the path too.
        - **Two ports, two jobs, two firewall rules.** 2202 is the library your readers use, 2203 is the admin page. ZFW's default policy is `deny`, so both need an allow rule — and then `apply` **and** `commit`. Without that the app answers on the host and times out from everywhere else.
        - **Where the files go: `/DATA/Media/Books`, `/DATA/Media/Comics`, `/DATA/Media/Files`** — **not** `/DATA/AppData/ubooquity/`. That folder exists and looks like the obvious place in the file manager, but only `config` inside it is mounted; books dropped there are invisible to the app, and the library then shows "No file to display" as if nothing had been imported. Change the host side under "Advanced (show more)" if your library lives elsewhere; the container paths `/books`, `/comics` and `/files` must stay as they are, Ubooquity scans exactly those.
        - **A new file is not picked up by itself.** "Automatic scan period" ships as **Disabled**, so after copying books in, go to the admin page → GENERAL → **LAUNCH NEW SCAN**, or set a scan period there once. The counter under "Status" tells you whether it found them.
        - **MAXMEM is the Java heap cap in MB**, set to 1024 against a 2 GB container limit. Raise both together for a large library, and keep MAXMEM the lower of the two.
  index: /ubooquity/
  is_uncontrolled: false
  port_map: '2202'
