# Gitea with working Actions — the ISOLATED runner variant.
#
# Same app as docker-compose.yml, one difference that matters: the runner does
# NOT get the host's Docker socket. It brings its own Docker daemon
# (`0.6.1-dind-rootless`, rootless dockerd inside the container) and therefore
# needs `privileged: true`.
#
#   socket variant  → a job can run `docker ps` and see every container on the
#                     machine (measured 2026-07-25: all 21 of them). Pushing a
#                     workflow equals root on the host.
#   this variant    → a job sees only the runner's own daemon. The blast radius
#                     of a malicious workflow ends at this container.
#
# `privileged: true` is not a free lunch either: a privileged container can in
# principle escape too. It is a much smaller door than handing out the socket,
# not a closed one.
#
# ────────────────────────────────────────────────────────────────────────────
# CHANGE BEFORE YOU INSTALL:
#
#   1. The machine's address — it appears FOUR times: GITEA__server__ROOT_URL,
#      SSH_DOMAIN, DOMAIN and the runner's GITEA_INSTANCE_URL. The last one is
#      the one people get wrong: the runner hands it to every job container as
#      GITHUB_SERVER_URL, and a job container cannot resolve compose service
#      names, so `http://server:3000` there breaks actions/checkout.
#   2. ADMIN_PASSWORD, ADMIN_EMAIL and the database password.
#   3. Ports. Web 3020, Git-over-SSH 2226 in this file. Moving SSH means TWO
#      changes: the published port and GITEA__server__SSH_PORT.
#
# There is not one dollar sign in this file, on purpose — ZimaOS collapses the
# doubled compose escape when it stores the file. The provision script writes
# its shell variables as `@NAME` and translates them with `tr` before running.

name: gitea

services:
  # ── database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=gitea
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=jx86OvHPSol2Ssgn4lxT2I9V
      - TZ=UTC
    volumes:
      - type: bind
        source: /DATA/AppData/gitea/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - gitea-network

  # ── Gitea itself (the tile points here) ───────────────────────────────────
  server:
    image: gitea/gitea:1.27.0
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=UTC
      - GITEA__server__ROOT_URL=http://REPLACE-WITH-YOUR-ZIMAOS-IP:3020/
      - GITEA__server__SSH_DOMAIN=REPLACE-WITH-YOUR-ZIMAOS-IP
      - GITEA__server__DOMAIN=REPLACE-WITH-YOUR-ZIMAOS-IP
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_PORT=2226
      - GITEA__server__SSH_LISTEN_PORT=22
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__actions__ENABLED=true
      # Where Gitea's own CLI reaches the running instance. Must be set HERE:
      # only the server's entrypoint turns GITEA__* into app.ini, and the
      # provision container reads that same file.
      - GITEA__server__LOCAL_ROOT_URL=http://server:3000/
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=jx86OvHPSol2Ssgn4lxT2I9V
    volumes:
      - type: bind
        source: /DATA/AppData/gitea/data
        target: /data
    ports:
      - mode: ingress
        target: 3000
        published: "3020"
        protocol: tcp
      - mode: ingress
        target: 22
        published: "2226"
        protocol: tcp
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2GB
          cpus: "2.00"
    networks:
      - gitea-network

  # ── one-shot: first administrator and the runner's registration token ─────
  provision:
    image: gitea/gitea:1.27.0
    restart: on-failure
    user: "1000:1000"
    environment:
      - ADMIN_USERNAME=gitadmin
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=pSidNE59pOWgrVCW
      - GITEA_WORK_DIR=/data/gitea
      # GITEA__* would do nothing here: this container replaces the entrypoint
      # that translates those variables into app.ini.
    entrypoint:
      - /bin/bash
      - -c
    command:
      - |
        cat > /tmp/provision.at <<'PROVISION'
        echo "[provision] waiting for Gitea to answer its health check"
        until wget -q -O /dev/null http://server:3000/api/healthz; do sleep 3; done

        if [ ! -f /data/gitea/.zima-admin-created ]; then
          echo "[provision] creating the administrator"
          /app/gitea/gitea admin user create --admin \
            --username "@ADMIN_USERNAME" --email "@ADMIN_EMAIL" \
            --password "@ADMIN_PASSWORD" --must-change-password=false
          touch /data/gitea/.zima-admin-created
        else
          echo "[provision] administrator already exists, leaving it alone"
        fi

        if [ ! -s /token/token.txt ]; then
          echo "[provision] minting a runner registration token"
          /app/gitea/gitea actions generate-runner-token > /tmp/token.txt 2>&1
          # "not empty" is NOT "is a token": when the CLI cannot reach the
          # running instance it prints "Internal Server Connection Error" to
          # stdout and exits 0. Check the shape instead: 40 alphanumerics.
          if ! grep -qE '^[A-Za-z0-9]{40}@' /tmp/token.txt; then
            echo "[provision] FAILED: that is not a token:"
            cat /tmp/token.txt
            exit 1
          fi
          cp /tmp/token.txt /token/token.txt
          echo "[provision] wrote the token for the runner"
        else
          echo "[provision] token already present, leaving it alone"
        fi
        echo "[provision] done"
        PROVISION
        tr '@' '\044' < /tmp/provision.at > /tmp/provision.sh
        exec /bin/bash /tmp/provision.sh
    volumes:
      - type: bind
        source: /DATA/AppData/gitea/data
        target: /data
      - type: bind
        source: /DATA/AppData/gitea/token
        target: /token
    depends_on:
      server:
        condition: service_started
    networks:
      - gitea-network

  # ── the Actions runner, with its own Docker daemon ────────────────────────
  runner:
    image: gitea/act_runner:0.6.1-dind-rootless
    restart: unless-stopped
    # Required by the rootless dockerd inside this image. The image already
    # ships DOCKER_HOST=unix:///run/user/1000/docker.sock and runs as the
    # `rootless` user; its s6 supervisor starts dockerd first and act_runner
    # only after `docker info` answers.
    privileged: true
    environment:
      - TZ=UTC
      # 🔴 Must be reachable from OUTSIDE this compose network — job containers
      # get this as GITHUB_SERVER_URL and live in their own network, where
      # `server` does not resolve (measured 2026-07-25: actions/checkout dies
      # with "Could not resolve host: server").
      - GITEA_INSTANCE_URL=http://REPLACE-WITH-YOUR-ZIMAOS-IP:3020
      - GITEA_RUNNER_REGISTRATION_TOKEN_FILE=/token/token.txt
      - GITEA_RUNNER_NAME=zimaos-isolated
      # Low on purpose: the entrypoint reads the token file once, BEFORE its
      # retry loop, so a longer wait cannot help — a restart re-reads it.
      - GITEA_MAX_REG_ATTEMPTS=3
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://gitea/runner-images:ubuntu-latest,alpine:docker://alpine:3.21
    volumes:
      # No /var/run/docker.sock here — that is the whole point of this variant.
      - type: bind
        source: /DATA/AppData/gitea/runner
        target: /data
      - type: bind
        source: /DATA/AppData/gitea/token
        target: /token
        read_only: true
    depends_on:
      server:
        condition: service_started
      provision:
        condition: service_completed_successfully
    networks:
      - gitea-network
    labels:
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png
    x-casaos:
      volumes:
        - container: /data
          description:
            en_US: Runner state and job workspaces

networks:
  gitea-network:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: server
  id: io.github.chicohaager.gitea
  version: 1.27.0
  scheme: http
  author: Lintuxer
  developer: Gitea
  category: Developer
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png
  title:
    en_US: Gitea
    custom: Gitea
  tagline:
    en_US: Sign in as gitadmin — Git hosting with working Actions
  description:
    en_US: |
      Gitea 1.27 with a working Actions runner in a single ZimaOS app. Gitea,
      PostgreSQL and act_runner come up together, and a one-shot provision
      container creates the first administrator and mints the runner's
      registration token over Gitea's own CLI. This variant runs the runner
      with its own rootless Docker daemon instead of the host's socket, so a
      workflow can start containers without seeing the rest of the machine.

      **Install it through "Custom install", not the blue button.** Four values
      have to carry this machine's address, and that dialog is the only place
      they can be reached: switch on "Advanced (show more)", then pick the
      service in the row of tabs and edit its variables.

      - `server` — `GITEA__server__ROOT_URL`, `GITEA__server__SSH_DOMAIN` and
        `GITEA__server__DOMAIN`: replace `REPLACE-WITH-YOUR-ZIMAOS-IP` with
        this machine's address.
      - `runner` — `GITEA_INSTANCE_URL`: the same address, no trailing slash.
        This is the one people get wrong. The runner hands the value to every
        job container, and a job container cannot resolve compose service
        names, so `http://server:3000` there breaks actions/checkout.
      - `provision` — `ADMIN_PASSWORD`: the password in this file is public,
        because this file is public. Change it before you install.

      **The tile opens Gitea's start page — "Git with a cup of tea". That is
      not the Gitea website and not an error: it is your own Gitea, greeting a
      visitor who is not signed in.** Sign in at the top right, user
      `gitadmin`, with the `ADMIN_PASSWORD` you set. What you find afterwards:

      - Sign-ups are disabled. Further accounts come from Site Administration.
      - The runner is already registered: Site Administration → Actions →
        Runners lists it as `zimaos-isolated`. Actions still have to be
        switched on per repository, under that repository's settings.
      - Web interface on port 3020, Git over SSH on 2226. Both are published
        to the LAN without TLS; put a reverse proxy in front for anything else.
  tips:
    before_install:
      en_US: >-
        Set ROOT_URL, SSH_DOMAIN, DOMAIN and the runner's GITEA_INSTANCE_URL to
        this machine's address before installing, and change ADMIN_PASSWORD —
        all of them live behind "Custom install" plus "Advanced (show more)".
        After installing, the tile shows Gitea's logged-out start page; sign in
        as gitadmin. The runner runs privileged because it carries its own
        Docker daemon; it does not get the host's Docker socket. Sign-ups are
        disabled by default.
  index: /
  port_map: "3020"
