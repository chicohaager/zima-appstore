# Craft Suite — nine open-source creative and office apps for the browser, served by nginx.
#
# PhotoCraft, LightCraft, FilmCraft, EffectCraft, DesignCraft, DeckCraft, GridCraft, PdfCraft
# and CADCraft, as the official WebAssembly builds from their GitHub releases. There is no
# server-side code, no database and no volume: documents stay in the browser. Open uses the
# browser's file picker, Save and Export download the file.
#
# All apps share one origin (this box and port), each under its own path.

name: craftsuite

services:
  craftsuite:
    image: chicohaager/craftsuite:1.0.3@sha256:d119875549b54f4def3bf34b1ff733eca1a9dfda8433c65f8b211b53ed7cef92
    container_name: craftsuite
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - target: 8080
        published: "8088"
        protocol: tcp
x-casaos:
  main: craftsuite
  id: io.github.chicohaager.craftsuite
  version: 1.0.3
  icon: https://chicohaager.github.io/zima-appstore/apps/io.github.chicohaager.craftsuite/assets/icon.png
  index: /
  port_map: "8088"
  scheme: http
  title:
    custom: Craft Suite
    en_US: Craft Suite
