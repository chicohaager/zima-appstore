name: invoiceninja
services:
  mysql:
    image: mysql:8@sha256:1d6b6a8fcee8ff758ff151d017f5203cd06792a0e698f0a593c9dfcb14609cf0
    restart: unless-stopped
    environment:
    - MYSQL_DATABASE=ninja
    - MYSQL_USER=ninja
    - MYSQL_PASSWORD=9bEQqzjDAHyPXJDETnJE0zxh
    - MYSQL_ROOT_PASSWORD=8pebPB8x7kIyARMlfkqGQbqF
    volumes:
    - type: bind
      source: /DATA/AppData/invoiceninja/mysql
      target: /var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      - -uninja
      - -p9bEQqzjDAHyPXJDETnJE0zxh
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
    - invoiceninja-network
  redis:
    image: redis:alpine@sha256:465aff338d817971674ff1ec3c0d59182e2b687018e87bf94b6e1491d0bb79e2
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/invoiceninja/redis
      target: /data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
    - invoiceninja-network
  app:
    image: invoiceninja/invoiceninja-debian:5.13.26@sha256:f938079be2b24df0fe5f1478c281df9011c658f3ad46fc02173bc578bb923fe0
    restart: unless-stopped
    environment:
    - APP_URL=http://REPLACE-WITH-YOUR-ZIMAOS-IP:8012
    - APP_KEY=base64:YJvro32quyjIYcyfMvqnirUS+g3nzkw6HtbpwwCaqZI=
    - APP_ENV=production
    - APP_DEBUG=false
    - REQUIRE_HTTPS=false
    - TRUSTED_PROXIES=*
    - IS_DOCKER=true
    - IN_USER_EMAIL=admin@example.com
    - IN_PASSWORD=K51wwYLRE0mLSDWR
    - DB_CONNECTION=mysql
    - DB_HOST=mysql
    - DB_PORT=3306
    - DB_DATABASE=ninja
    - DB_USERNAME=ninja
    - DB_PASSWORD=9bEQqzjDAHyPXJDETnJE0zxh
    - CACHE_DRIVER=redis
    - QUEUE_CONNECTION=redis
    - SESSION_DRIVER=redis
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=null
    - PDF_GENERATOR=snappdf
    - PHANTOMJS_PDF_GENERATION=false
    - FILESYSTEM_DISK=debian_docker
    - SCOUT_DRIVER=null
    - MAIL_MAILER=log
    - MAIL_FROM_ADDRESS=user@example.com
    - MAIL_FROM_NAME=Self Hosted User
    volumes:
    - type: bind
      source: /DATA/AppData/invoiceninja/public
      target: /var/www/html/public
    - type: bind
      source: /DATA/AppData/invoiceninja/storage
      target: /var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2GB
          cpus: '2.00'
    networks:
    - invoiceninja-network
  nginx:
    image: nginx:alpine@sha256:1d40e3eb3bf4f138de1d67193f2aa5309fcaf343eb5ffadbf5e9439de1eb1ebb
    restart: unless-stopped
    command:
    - /bin/sh
    - -c
    - "cat > /tmp/laravel.conf <<'NGINXCONF'\nserver {\n    listen 80 default_server;\n\
      \    server_name _;\n    root /var/www/html/public;\n\n    add_header X-Frame-Options\
      \ \"SAMEORIGIN\";\n    add_header X-Content-Type-Options \"nosniff\";\n\n  \
      \  index index.php;\n    charset utf-8;\n\n    location / {\n        try_files\
      \ @uri @uri/ /index.php?@query_string;\n    }\n\n    location = /favicon.ico\
      \ { access_log off; log_not_found off; }\n    location = /robots.txt  { access_log\
      \ off; log_not_found off; }\n\n    error_page 404 /index.php;\n\n    location\
      \ ~ \\.php@ {\n        fastcgi_pass app:9000;\n        fastcgi_param SCRIPT_FILENAME\
      \ @realpath_root@fastcgi_script_name;\n        include fastcgi_params;\n   \
      \ }\n\n    location ~ /\\.(?!well-known).* {\n        deny all;\n    }\n}\n\
      NGINXCONF\ncat > /etc/nginx/conf.d/invoiceninja.conf <<'NGINXCONF'\nclient_max_body_size\
      \ 10M;\nclient_body_buffer_size 10M;\nserver_tokens off;\nfastcgi_buffers 32\
      \ 16K;\ngzip on;\ngzip_comp_level 2;\ngzip_min_length 1M;\ngzip_proxied any;\n\
      gzip_types *;\nNGINXCONF\ntr '@' '\\044' < /tmp/laravel.conf > /etc/nginx/conf.d/default.conf\n\
      exec nginx -g 'daemon off;'\n"
    ports:
    - mode: ingress
      target: 80
      published: '8012'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/invoiceninja/public
      target: /var/www/html/public
      read_only: true
    - type: bind
      source: /DATA/AppData/invoiceninja/storage
      target: /var/www/html/storage
      read_only: true
    depends_on:
      app:
        condition: service_started
    networks:
    - invoiceninja-network
networks:
  invoiceninja-network:
    driver: bridge
x-casaos:
  main: nginx
  id: io.github.chicohaager.invoiceninja
  scheme: http
  icon: https://chicohaager.github.io/zima-appstore/apps/io.github.chicohaager.invoiceninja/assets/icon.png
  title:
    en_US: Invoice Ninja
    custom: Invoice Ninja
  index: /
  port_map: '8012'
  version: 5.13.26
