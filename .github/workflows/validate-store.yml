name: Validate Store

# A pull request may not break the build. The store is only as good as the
# dist/ it produces, so this runs the same build the release workflow runs —
# it just throws the output away.

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v2 dist
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: dist
          base-url: https://chicohaager.github.io/zima-appstore
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json

      - name: Show what was built
        run: |
          find dist -type f | sort
          cat dist/index.json

      # Fixed secrets: gitleaks over Apps/, against the list of known findings
      # (scripts/known_secrets.json). A new key, a new app or a changed value fails.
      # Last, so a red result here never hides a broken build. Only here, on pull requests --
      # not in release-store.yml, so store updates that only
      # bump image tags are never held up by it.
      - name: Install gitleaks 8.30.1 (checksum-pinned)
        run: |
          curl -fsSLo /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Test the secrets check
        run: python3 scripts/test_check_secrets.py

      - name: No new fixed secrets
        run: python3 scripts/check_secrets.py .
