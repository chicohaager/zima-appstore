name: Release Store

# Builds the v2 store (dist/) and publishes it to the gh-pages branch.
# ZimaOS 1.7.0-beta1 imports a store from its store.json — a zip source is
# rejected by the App Store UI with "Unsupported import method."

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-store
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Store checks (tests + no tag may go down)
        # ZimaOS 1.8 takes the store compose as image target of an installed app;
        # an older tag here becomes a downgrade on the user's box (measured 2026-10-16).
        # Deliberate rollback: set ALLOW_DOWNGRADE="<app-id>:<service>" for that run.
        run: |
          python -m pip install --quiet pyyaml
          python scripts/test_store_checks.py
          python scripts/check_no_downgrade.py Apps https://chicohaager.github.io/zima-appstore

      - name: Build v2 dist
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: dist
          base-url: https://chicohaager.github.io/zima-appstore
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json

      - name: Locale overlays for every supported language
        # ZimaOS 1.8 requests store/index/meta.<locale>.json; without them each
        # non-English client logs 404 "background repo resource refresh failed".
        run: python scripts/add_locale_fallbacks.py dist supported-languages.json

      - name: Show what was built
        run: |
          echo "--- dist tree ---"
          find dist -type f | sort
          echo "--- store.json ---"
          cat dist/store.json
          echo "--- index.json ---"
          cat dist/index.json

      - name: Deploy dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
